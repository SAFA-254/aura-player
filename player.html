<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aura · плеер</title>
<!--
  Невидимая страница для фоновой службы Android-приложения Aura:
  здесь живёт официальный Spotify Web Playback SDK, а окно Aura только управляет им.
  Мост window.AuraEngine есть только внутри приложения.
-->
</head>
<body>
<script>
'use strict';
const E = window.AuraEngine;
const fmt = (ms) => Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0');

window.onSpotifyWebPlaybackSDKReady = () => {
  const p = new window.Spotify.Player({
    name: 'Aura',
    getOAuthToken: (cb) => { const t = E.token(); if (t) cb(t); },
    volume: 1,
  });
  p.addListener('ready', ({ device_id }) => E.ready(device_id));
  p.addListener('not_ready', () => E.notReady());
  for (const ev of ['initialization_error', 'authentication_error', 'account_error', 'playback_error']) {
    p.addListener(ev, ({ message }) => E.fail(ev, message || ''));
  }
  p.addListener('autoplay_failed', () => E.fail('playback_error', 'autoplay_failed'));
  p.addListener('player_state_changed', (st) => {
    E.state(st ? JSON.stringify({
      paused: st.paused,
      position: st.position,
      duration: st.duration,
      track: st.track_window?.current_track?.name || '',
    }) : '');
  });
  window.player = p;
  p.connect().then((ok) => { if (!ok) E.fail('connect', 'плеер не смог подключиться к Spotify'); });

  // Отметка раз в 15 секунд, пока играет музыка: по журналу видно, что страница жива
  setInterval(() => {
    p.getCurrentState().then((st) => { if (st && !st.paused) E.heartbeat(st.position); }).catch(() => {});
  }, 15000);
};
</script>
<script src="https://sdk.scdn.co/spotify-player.js" onerror="window.AuraEngine && AuraEngine.fail('load', '')"></script>
</body>
</html>
